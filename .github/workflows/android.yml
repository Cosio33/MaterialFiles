name: Android CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Build with Gradle
      run: ./gradlew assembleDebug lintVitalRelease
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 10
    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Material Files - APK search + Videos (fork)
        body: |
          Fork de Material Files con modificaciones:
          - Acceso rapido "APK" en el panel lateral que busca todos los .apk del dispositivo.
          - Carpeta "Videos" (antes Movies), renombrada tambien en espanol.
        files: app/build/outputs/apk/debug/app-debug.apk
